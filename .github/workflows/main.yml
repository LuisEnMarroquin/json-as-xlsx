name: Prod deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    if: github.repository == 'LuisEnMarroquin/json-as-xlsx'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
      - run: yarn
      - run: yarn test
      - run: yarn build
      - name: Copy files to library output folder
        run: |
          cp README.md packages/main-library/README.md
          cp LICENSE packages/main-library/LICENSE
      - name: Set environment variable for GitHub
        run: |
          CURRENT_VERSION="v$(node -p "require('./package.json').version")"
          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "CURRENT_VERSION $CURRENT_VERSION"
        working-directory: packages/main-library/
      - name: Check if version is already published
        id: check
        working-directory: packages/main-library/
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Resolved $NAME@$VERSION"
          set +e
          VIEW_OUTPUT=$(npm view "$NAME@$VERSION" version 2>&1)
          VIEW_STATUS=$?
          set -e
          if [ $VIEW_STATUS -eq 0 ]; then
            echo "$NAME@$VERSION is already published; skipping npm publish and GitHub release."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          elif echo "$VIEW_OUTPUT" | grep -q "E404"; then
            echo "$NAME@$VERSION is not published yet; will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm view failed with an unexpected (non-404) error; refusing to guess:"
            echo "$VIEW_OUTPUT"
            exit 1
          fi
      - name: Publish package to NPM registry
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --provenance --access public
        working-directory: packages/main-library/
      - name: Create a new GitHub release
        if: steps.check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ env.CURRENT_VERSION }} -F README.md -t "Released ${{ env.CURRENT_VERSION }}"
      - name: Prepare static files for deployment
        run: yarn run static
      - uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          folder: build
          branch: gh-pages
          git-config-name: LuisEnMarroquin
          git-config-email: mluis651@gmail.com
